<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安全隐患通知(整改)单 · 打印</title>
  <script type="module" crossorigin src="/lark-base-print/assets/index-DZMpNstp.js"></script>
  <link rel="stylesheet" crossorigin href="/lark-base-print/assets/index-C1h2fl1e.css">
</head>
<body>
  <div class="toolbar no-print">
    <button id="btn-print">打印整改单</button>
    <button id="btn-print-kh">打印考核单</button>
    <button id="btn-reload">重新读取</button>
    <!-- 🔴 唯一会写 Base 的按钮：点了才写编号，打印本身绝不写数据 -->
    <button id="btn-no" hidden>生成整改单编号</button>
    <span id="status">初始化中…</span>
    <!-- 浏览器自己加的页眉页脚（日期/网址/页码）CSS 关不掉，只能在打印对话框里取消 -->
    <span class="print-tip">打印前先在「更多设置」里取消勾选「页眉和页脚」，否则纸上会带网址和日期</span>
    <!-- 🔴 版本号常驻：GitHub Pages 给 index.html 设了 600 秒缓存，
         刷新后看这里就知道飞书加载的到底是不是新版，不用靠"打印出来变没变"猜 -->
    <span id="build-tag" class="build-tag"></span>
  </div>
  <!-- 初始占位：若这段文字一直不消失，说明 JS 没跑起来（而不是数据读取失败） -->
  <div id="sheet-host">
    <div class="empty-hint">正在加载插件…</div>
  </div>
</body>
</html>
