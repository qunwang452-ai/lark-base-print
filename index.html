<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安全隐患通知(整改)单 · 打印</title>
  <script type="module" crossorigin src="/lark-base-print/assets/index-jWUrKJuX.js"></script>
  <link rel="stylesheet" crossorigin href="/lark-base-print/assets/index-BBLm-glW.css">
</head>
<body>
  <div class="toolbar no-print">
    <button id="btn-print">打印 / 导出 PDF</button>
    <button id="btn-reload">重新读取</button>
    <span id="status">初始化中…</span>
    <!-- 浏览器自己加的页眉页脚（日期/网址/页码）CSS 关不掉，只能在打印对话框里取消 -->
    <span class="print-tip">打印前先在「更多设置」里取消勾选「页眉和页脚」，否则纸上会带网址和日期</span>
  </div>
  <!-- 初始占位：若这段文字一直不消失，说明 JS 没跑起来（而不是数据读取失败） -->
  <div id="sheet-host">
    <div class="empty-hint">正在加载插件…</div>
  </div>
</body>
</html>
